    <script>
      // Gracefully ignore WebSocket errors in environment where HMR is disabled
      window.addEventListener('error', function (e) {
        if (e.message && (e.message.includes('WebSocket') || e.message.includes('ws://') || e.message.includes('wss://'))) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      });
      window.addEventListener('unhandledrejection', function (e) {
        var reason = e.reason && (e.reason.message || e.reason);
        if (typeof reason === 'string' && (reason.includes('WebSocket') || reason.includes('ws://') || reason.includes('wss://'))) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      });
    </script>
